name: CI

on:
  push:
    branches:
      - main
      - claude/realtime-location-sharing-xtjlxa
  pull_request:

jobs:
  quality:
    name: Typecheck · Lint · Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --force

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci
